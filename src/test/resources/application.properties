# ==============================================================================
# Test Profile Configuration (H2 in MySQL mode)
# ==============================================================================
spring.application.name=internship-management-system-test
server.port=0

spring.datasource.url=jdbc:h2:mem:imstestdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

app.admin.email=admin@ims.edu
app.admin.password=Admin@12345
app.admin.name=System Administrator

app.cors.allowed-origins=http://localhost:5173
app.upload.dir=target/test-uploads

app.ai.api-key=
app.ai.model=gpt-4o-mini
app.ai.provider=internal-rag

spring.cache.type=simple
management.endpoints.web.exposure.include=health
