# ==============================================================================
# Internship Management System - H2 Development Profile
# Activate: --spring.profiles.active=h2
# ==============================================================================

spring.application.name=internship-management-system

server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:ims_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Admin
app.admin.email=admin@ims.edu
app.admin.password=Admin@12345
app.admin.name=System Administrator

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# File Upload
app.upload.dir=uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AI
app.ai.api-key=
app.ai.model=gpt-4o-mini
app.ai.provider=internal-rag

# Cache
spring.cache.type=simple
spring.cache.cache-names=internships,internship-stats,announcements,platform-summary

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.example.internshipmanagement=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
