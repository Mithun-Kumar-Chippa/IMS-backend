# ==============================================================================
# Internship Management System - Application Configuration
# ==============================================================================

spring.application.name=internship-management-system
server.port=8080

# ------------------------------------------------------------------------------
# Database Configuration (MySQL 8)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ims_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mithun}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Security & JWT Configuration
# ------------------------------------------------------------------------------
# 256-bit hex HMAC-SHA key for signing JWT tokens
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours validity
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Administrator Bootstrap
app.admin.email=${ADMIN_EMAIL:admin@ims.edu}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:System Administrator}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# File Upload Settings (PDF resumes up to 5MB)
app.upload.dir=${UPLOAD_DIR:uploads/resumes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ------------------------------------------------------------------------------
# AI & Chatbot Configuration
# ------------------------------------------------------------------------------
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.provider=${AI_PROVIDER:internal-rag}

# ------------------------------------------------------------------------------
# Caching Configuration
# ------------------------------------------------------------------------------
spring.cache.type=simple
spring.cache.cache-names=internships,internship-stats,announcements,platform-summary

# ------------------------------------------------------------------------------
# Actuator & Monitoring
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.example.internshipmanagement=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
