services:
  - type: web
    name: ims-backend
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: ims-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/ims-uploads

databases:
  - name: ims-postgres
    plan: free
    databaseName: ims_db
    user: ims_user
    ipAllowList: []